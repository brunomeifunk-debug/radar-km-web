name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar firebase.json (sempre certo)
        run: |
          cat > firebase.json <<'FIM'
          {
            "hosting": {
              "public": ".",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"]
            }
          }
          FIM
          cat firebase.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: radar-km
          channelId: live
